const langFlags = { ar:'🇸🇦', en:'🇬🇧', fr:'🇫🇷', es:'🇪🇸', de:'🇩🇪', zh:'🇨🇳', ja:'🇯🇵', ko:'🇰🇷', tr:'🇹🇷', hi:'🇮🇳' };
let currentLang = 'ar';

function switchLang(lang) {
  currentLang = lang;
  const t = translations[lang];
  const html = document.documentElement;
  html.setAttribute('dir', t.dir);
  html.setAttribute('lang', t.lang);
  document.body.style.fontFamily = t.fontFamily;

  document.getElementById('headerName').textContent = t.name;
  document.getElementById('footerText').textContent = t.footer;
  document.getElementById('navTitle').textContent = t.nav;

  // Lang buttons
  const selector = document.getElementById('langSelector');
  selector.innerHTML = '';
  Object.keys(langFlags).forEach(l => {
    const btn = document.createElement('button');
    btn.className = `lang-btn px-2 py-1 rounded text-sm ${l === lang ? 'active' : ''}`;
    btn.style.background = l === lang ? '#2d6a5e' : 'rgba(45,106,94,0.08)';
    btn.style.color = l === lang ? '#fff' : '#2d6a5e';
    btn.textContent = langFlags[l];
    btn.title = l.toUpperCase();
    btn.onclick = () => switchLang(l);
    selector.appendChild(btn);
  });

  // Nav links
  const navLinks = document.getElementById('navLinks');
  navLinks.innerHTML = '';
  t.sections.forEach((s, i) => {
    const a = document.createElement('a');
    a.href = '#section-' + i;
    a.className = 'block px-3 py-2 rounded-lg hover:bg-gray-50 transition text-sm font-medium';
    a.style.color = '#2d6a5e';
    a.textContent = s;
    a.onclick = () => closeNavMenu();
    navLinks.appendChild(a);
  });

  // Nav panel position
  const navPanel = document.getElementById('navPanel');
  navPanel.style.right = t.dir === 'rtl' ? '0' : 'auto';
  navPanel.style.left = t.dir === 'rtl' ? 'auto' : '0';
  navPanel.style.transform = t.dir === 'rtl' ? 'translateX(100%)' : 'translateX(-100%)';

  renderContent(t);
}

function openNavMenu() {
  const overlay = document.getElementById('navOverlay');
  const panel = document.getElementById('navPanel');
  overlay.style.visibility = 'visible';
  overlay.style.opacity = '1';
  panel.style.transform = 'translateX(0)';
}
function closeNavMenu() {
  const overlay = document.getElementById('navOverlay');
  const panel = document.getElementById('navPanel');
  const t = translations[currentLang];
  overlay.style.visibility = 'hidden';
  overlay.style.opacity = '0';
  panel.style.transform = t.dir === 'rtl' ? 'translateX(100%)' : 'translateX(-100%)';
}

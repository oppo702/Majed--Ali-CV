        document.querySelector('[data-template-id="skills-heading"]').textContent = t.skillsHeading;
        document.querySelector('[data-template-id="training-heading"]').textContent = t.trainingHeading;
        document.querySelector('[data-template-id="footer-text"]').textContent = t.footer;
